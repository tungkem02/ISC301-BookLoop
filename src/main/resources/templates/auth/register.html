<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head('Register')}"></head>
<body>
<nav th:replace="~{layout/layout :: navbar}"></nav>

<main class="page-container page-content">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <!-- Page header -->
            <div class="text-center mb-4">
                <div class="mb-3">
                    <div style="width:64px;height:64px;background:linear-gradient(135deg,var(--color-primary),#7C3AED);
                                border-radius:var(--radius-xl);display:inline-flex;align-items:center;
                                justify-content:center;font-size:1.75rem;">
                        📚
                    </div>
                </div>
                <h1 class="section-title">Create your BookLoop account</h1>
                <p class="text-muted">Join thousands of students buying and selling textbooks.</p>
            </div>

            <div class="bl-form-card">

                <!-- Success message (redirect from elsewhere) -->
                <div th:if="${successMessage}" class="alert-success-bl alert-auto-dismiss mb-4">
                    <i class="fa-solid fa-circle-check"></i>
                    <span th:text="${successMessage}"></span>
                </div>

                <form th:action="@{/register}" method="post" th:object="${registrationForm}"
                      id="registerForm" novalidate>
                    <!-- CSRF token is handled automatically by Thymeleaf's th:action -->

                    <!-- Full Name -->
                    <div class="bl-form-group">
                        <label for="fullName">Full Name <span class="text-danger">*</span></label>
                        <input type="text" id="fullName" th:field="*{fullName}"
                               class="bl-form-control"
                               th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                               placeholder="Your full name" autocomplete="name"/>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}">
                            <i class="fa-solid fa-triangle-exclamation me-1"></i>
                            <span th:errors="*{fullName}"></span>
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="bl-form-group">
                        <label for="email">Student Email <span class="text-danger">*</span></label>
                        <input type="email" id="email" th:field="*{email}"
                               class="bl-form-control"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                               placeholder="your.email@university.edu" autocomplete="email"/>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}">
                            <i class="fa-solid fa-triangle-exclamation me-1"></i>
                            <span th:errors="*{email}"></span>
                        </div>
                    </div>

                    <!-- University and Campus (2 columns) -->
                    <div class="row g-3">
                        <div class="col-sm-6">
                            <div class="bl-form-group mb-0">
                                <label for="university">University</label>
                                <input type="text" id="university" th:field="*{university}"
                                       class="bl-form-control"
                                       placeholder="e.g. State University" autocomplete="organization"/>
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <div class="bl-form-group mb-0">
                                <label for="campus">Campus / Location</label>
                                <input type="text" id="campus" th:field="*{campus}"
                                       class="bl-form-control"
                                       placeholder="e.g. Main Campus"/>
                            </div>
                        </div>
                    </div>

                    <!-- Phone (optional) -->
                    <div class="bl-form-group mt-3">
                        <label for="phone">Phone <span class="text-muted small">(optional)</span></label>
                        <input type="tel" id="phone" th:field="*{phone}"
                               class="bl-form-control"
                               placeholder="+1 555 0100" autocomplete="tel"/>
                    </div>

                    <!-- Password -->
                    <div class="bl-form-group">
                        <label for="password">Password <span class="text-danger">*</span></label>
                        <input type="password" id="password" th:field="*{password}"
                               class="bl-form-control"
                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                               placeholder="Minimum 8 characters" autocomplete="new-password"/>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}">
                            <i class="fa-solid fa-triangle-exclamation me-1"></i>
                            <span th:errors="*{password}"></span>
                        </div>
                    </div>

                    <!-- Confirm Password -->
                    <div class="bl-form-group">
                        <label for="confirmPassword">Confirm Password <span class="text-danger">*</span></label>
                        <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
                               class="bl-form-control"
                               th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                               placeholder="Repeat your password" autocomplete="new-password"/>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}">
                            <i class="fa-solid fa-triangle-exclamation me-1"></i>
                            <span th:errors="*{confirmPassword}"></span>
                        </div>
                    </div>

                    <!-- Submit -->
                    <button type="submit" id="registerBtn"
                            class="btn-primary-bl w-100 justify-content-center mt-2"
                            style="padding: 0.75rem 1.5rem; font-size: 1rem;">
                        <i class="fa-solid fa-user-plus me-2"></i>Create Account
                    </button>
                </form>

                <!-- Login link -->
                <p class="text-center mt-4 text-muted" style="font-size:0.875rem;">
                    Already have an account?
                    <a th:href="@{/login}" style="font-weight:600;">Sign in here</a>
                </p>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout/layout :: footer}"></footer>
<th:block th:replace="~{layout/layout :: scripts}"></th:block>
</body>
</html>
