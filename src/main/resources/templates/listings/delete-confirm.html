<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head('Delete Listing')}"></head>
<body>
<nav th:replace="~{layout/layout :: navbar}"></nav>

<main class="page-container page-content">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">

            <div class="bl-form-card text-center">

                <!-- Warning icon -->
                <div class="mb-4">
                    <div style="width:72px;height:72px;background:#FEE2E2;border-radius:var(--radius-full);
                                display:inline-flex;align-items:center;justify-content:center;font-size:2rem;">
                        <i class="fa-solid fa-trash" style="color:#EF4444;"></i>
                    </div>
                </div>

                <h2 style="font-size:1.25rem; font-weight:700; color:var(--color-gray-900); margin-bottom:0.75rem;">
                    Delete this listing?
                </h2>

                <p class="text-muted" style="font-size:0.9rem;">
                    You are about to permanently delete the following listing.
                    This action <strong>cannot be undone</strong>.
                </p>

                <!-- Listing preview -->
                <div class="bl-form-card mt-4 mb-4 text-start"
                     style="background:var(--color-gray-50); border: 1px solid var(--color-gray-200);">
                    <div class="d-flex gap-3 align-items-center">
                        <div style="width:60px;height:75px;border-radius:var(--radius-md);
                                    background:linear-gradient(135deg,#EEF2FF,#E0E7FF);
                                    display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;">
                            <img th:if="${product.imageUrl != null and !#strings.isEmpty(product.imageUrl)}"
                                 th:src="${product.imageUrl}" style="width:100%;height:100%;object-fit:cover;"
                                 onerror="this.style.display='none';"/>
                            <span th:if="${product.imageUrl == null or #strings.isEmpty(product.imageUrl)}"
                                  style="font-size:2rem; opacity:0.35;">📖</span>
                        </div>
                        <div>
                            <div style="font-weight:700; font-size:0.9rem; color:var(--color-gray-900);"
                                 th:text="${product.title}">Title</div>
                            <div style="font-size:0.8rem; color:var(--color-gray-500);"
                                 th:text="${product.condition.displayName}">Condition</div>
                            <div style="font-weight:700; color:var(--color-primary);"
                                 th:text="${'$' + product.price}">$0</div>
                        </div>
                    </div>
                </div>

                <!-- Action buttons -->
                <div class="d-flex gap-3 justify-content-center">
                    <form th:action="@{/my-listings/{id}/delete(id=${product.id})}" method="post"
                          class="delete-form">
                        <button type="submit"
                                style="background:var(--color-danger); color:#fff; border:none;
                                       border-radius:var(--radius-full); padding:0.6rem 2rem;
                                       font-weight:600; font-size:0.9rem; cursor:pointer;
                                       transition:background 0.15s ease;">
                            <i class="fa-solid fa-trash me-2"></i>Yes, Delete
                        </button>
                    </form>
                    <a th:href="@{/my-listings}"
                       class="btn-outline-bl" style="padding:0.6rem 2rem;">
                        Cancel
                    </a>
                </div>
            </div>

        </div>
    </div>
</main>

<footer th:replace="~{layout/layout :: footer}"></footer>
<th:block th:replace="~{layout/layout :: scripts}"></th:block>
</body>
</html>
