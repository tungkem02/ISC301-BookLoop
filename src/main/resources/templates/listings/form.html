<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head(${isEdit} ? 'Edit Listing' : 'New Listing')}"></head>
<body>
<nav th:replace="~{layout/layout :: navbar}"></nav>

<main class="page-container page-content">

    <!-- Breadcrumb -->
    <nav class="bl-breadcrumb" aria-label="Breadcrumb">
        <a th:href="@{/my-listings}">My Listings</a>
        <span class="separator">/</span>
        <span class="current" th:text="${isEdit} ? 'Edit Listing' : 'New Listing'">Form</span>
    </nav>

    <div class="row justify-content-center">
        <div class="col-lg-9">

            <!-- Page header -->
            <div class="mb-4">
                <h1 class="section-title">
                    <i th:class="${isEdit} ? 'fa-solid fa-pen-to-square' : 'fa-solid fa-plus-circle'"
                       class="me-2" style="color:var(--color-primary);"></i>
                    <span th:text="${isEdit} ? 'Edit Listing' : 'Create New Listing'">Form</span>
                </h1>
                <p class="text-muted" th:text="${isEdit} ? 'Update your book listing details.' : 'Fill in the details about the textbook you want to sell.'"></p>
            </div>

            <div class="bl-form-card">
                <form th:action="${isEdit} ? @{/my-listings/{id}/edit(id=${productId})} : @{/my-listings/new}"
                      method="post" th:object="${productForm}" novalidate>

                    <!-- ============ SECTION: Book Information ============ -->
                    <h5 class="mb-3" style="font-weight:700; color:var(--color-gray-700);">
                        <i class="fa-solid fa-book me-2" style="color:var(--color-primary);"></i>
                        Book Information
                    </h5>

                    <!-- Title -->
                    <div class="bl-form-group">
                        <label for="title">Book Title <span class="text-danger">*</span></label>
                        <input type="text" id="title" th:field="*{title}"
                               class="bl-form-control"
                               th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''"
                               placeholder="e.g. Head First Java, 2nd Edition"/>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('title')}">
                            <i class="fa-solid fa-triangle-exclamation me-1"></i>
                            <span th:errors="*{title}"></span>
                        </div>
                    </div>

                    <!-- Author + Publisher -->
                    <div class="row g-3">
                        <div class="col-sm-6">
                            <div class="bl-form-group mb-0">
                                <label for="author">Author</label>
                                <input type="text" id="author" th:field="*{author}"
                                       class="bl-form-control"
                                       placeholder="e.g. Kathy Sierra"/>
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <div class="bl-form-group mb-0">
                                <label for="publisher">Publisher</label>
                                <input type="text" id="publisher" th:field="*{publisher}"
                                       class="bl-form-control"
                                       placeholder="e.g. O'Reilly Media"/>
                            </div>
                        </div>
                    </div>

                    <!-- Edition + ISBN + Course Code -->
                    <div class="row g-3 mt-0">
                        <div class="col-sm-4">
                            <div class="bl-form-group mb-0">
                                <label for="edition">Edition</label>
                                <input type="text" id="edition" th:field="*{edition}"
                                       class="bl-form-control" placeholder="e.g. 2nd"/>
                            </div>
                        </div>
                        <div class="col-sm-4">
                            <div class="bl-form-group mb-0">
                                <label for="isbn">ISBN</label>
                                <input type="text" id="isbn" th:field="*{isbn}"
                                       class="bl-form-control" placeholder="e.g. 978-0596009205"/>
                            </div>
                        </div>
                        <div class="col-sm-4">
                            <div class="bl-form-group mb-0">
                                <label for="courseCode">Course Code</label>
                                <input type="text" id="courseCode" th:field="*{courseCode}"
                                       class="bl-form-control" placeholder="e.g. CS101"/>
                            </div>
                        </div>
                    </div>

                    <!-- Category -->
                    <div class="bl-form-group mt-3">
                        <label for="category">Category</label>
                        <input type="text" id="category" th:field="*{category}"
                               class="bl-form-control"
                               placeholder="e.g. Computer Science, Business, Mathematics"/>
                    </div>

                    <!-- Description -->
                    <div class="bl-form-group">
                        <label for="description">Description</label>
                        <textarea id="description" th:field="*{description}"
                                  class="bl-form-control" rows="4"
                                  placeholder="Describe the condition, highlights, or any notes about this book..."></textarea>
                    </div>

                    <hr class="my-4" style="border-color:var(--color-gray-100);"/>

                    <!-- ============ SECTION: Pricing & Condition ============ -->
                    <h5 class="mb-3" style="font-weight:700; color:var(--color-gray-700);">
                        <i class="fa-solid fa-tags me-2" style="color:var(--color-primary);"></i>
                        Pricing &amp; Condition
                    </h5>

                    <!-- Price + Condition -->
                    <div class="row g-3">
                        <div class="col-sm-6">
                            <div class="bl-form-group mb-0">
                                <label for="price">Asking Price ($) <span class="text-danger">*</span></label>
                                <input type="number" id="price" th:field="*{price}"
                                       class="bl-form-control"
                                       th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''"
                                       placeholder="0.00" min="0" step="0.01"/>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('price')}">
                                    <i class="fa-solid fa-triangle-exclamation me-1"></i>
                                    <span th:errors="*{price}"></span>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <div class="bl-form-group mb-0">
                                <label for="condition">Condition <span class="text-danger">*</span></label>
                                <select id="condition" th:field="*{condition}"
                                        class="bl-form-control"
                                        th:classappend="${#fields.hasErrors('condition')} ? 'is-invalid' : ''">
                                    <option value="">Select condition...</option>
                                    <option th:each="c : ${conditions}"
                                            th:value="${c.name()}"
                                            th:text="${c.displayName}"></option>
                                </select>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('condition')}">
                                    <i class="fa-solid fa-triangle-exclamation me-1"></i>
                                    <span th:errors="*{condition}"></span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Defect notes -->
                    <div class="bl-form-group mt-3">
                        <label for="defectNotes">
                            Defect Notes <span class="text-muted small">(optional — describe any damage or wear)</span>
                        </label>
                        <textarea id="defectNotes" th:field="*{defectNotes}"
                                  class="bl-form-control" rows="3"
                                  placeholder="e.g. Minor scratches on the cover, some highlighting on pages 10-25..."></textarea>
                    </div>

                    <hr class="my-4" style="border-color:var(--color-gray-100);"/>

                    <!-- ============ SECTION: Location & Image ============ -->
                    <h5 class="mb-3" style="font-weight:700; color:var(--color-gray-700);">
                        <i class="fa-solid fa-location-dot me-2" style="color:var(--color-primary);"></i>
                        Meetup &amp; Image
                    </h5>

                    <!-- Campus -->
                    <div class="bl-form-group">
                        <label for="campus">Campus / Meetup Location <span class="text-danger">*</span></label>
                        <input type="text" id="campus" th:field="*{campus}"
                               class="bl-form-control"
                               th:classappend="${#fields.hasErrors('campus')} ? 'is-invalid' : ''"
                               placeholder="e.g. Main Campus Library, Dorm Block A"/>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('campus')}">
                            <i class="fa-solid fa-triangle-exclamation me-1"></i>
                            <span th:errors="*{campus}"></span>
                        </div>
                    </div>

                    <!-- Image URL + preview -->
                    <div class="bl-form-group">
                        <label for="imageUrl">
                            Book Cover Image URL <span class="text-muted small">(optional)</span>
                        </label>
                        <input type="url" id="imageUrl" th:field="*{imageUrl}"
                               class="bl-form-control"
                               placeholder="https://example.com/book-cover.jpg"/>
                        <small class="text-muted">Paste a URL to a book cover image. A preview will appear below.</small>
                        <div class="mt-3">
                            <img id="imagePreview" src=""
                                 alt="Image preview"
                                 style="display:none; max-height:180px; border-radius:var(--radius-lg);
                                        box-shadow:var(--shadow-md); border:2px solid var(--color-gray-200);"/>
                        </div>
                    </div>

                    <!-- Status (only on edit) -->
                    <div class="bl-form-group" th:if="${isEdit}">
                        <label for="status">Listing Status</label>
                        <select id="status" th:field="*{status}" class="bl-form-control">
                            <option th:each="s : ${statuses}"
                                    th:value="${s.name()}"
                                    th:text="${s.displayName}"></option>
                        </select>
                        <small class="text-muted">Change to "Sold" when completed, or "Hidden" to temporarily hide.</small>
                    </div>

                    <hr class="my-4" style="border-color:var(--color-gray-100);"/>

                    <!-- Submit -->
                    <div class="d-flex gap-3">
                        <button type="submit" class="btn-primary-bl"
                                style="padding:0.75rem 2rem; font-size:1rem;">
                            <i th:class="${isEdit} ? 'fa-solid fa-floppy-disk' : 'fa-solid fa-paper-plane'"
                               class="me-2"></i>
                            <span th:text="${isEdit} ? 'Update Listing' : 'Publish Listing'">Submit</span>
                        </button>
                        <a th:href="@{/my-listings}" class="btn-outline-bl"
                           style="padding:0.75rem 2rem; font-size:1rem;">
                            Cancel
                        </a>
                    </div>

                </form>
            </div>

        </div>
    </div>
</main>

<footer th:replace="~{layout/layout :: footer}"></footer>
<th:block th:replace="~{layout/layout :: scripts}"></th:block>
</body>
</html>
