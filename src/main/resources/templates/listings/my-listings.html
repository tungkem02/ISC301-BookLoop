<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head('My Listings')}"></head>
<body>
<nav th:replace="~{layout/layout :: navbar}"></nav>

<main class="page-container page-content">

    <!-- Flash messages -->
    <div th:if="${successMessage}" class="alert-success-bl alert-auto-dismiss fade-in-up">
        <i class="fa-solid fa-circle-check"></i>
        <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="alert-error-bl alert-auto-dismiss fade-in-up">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span th:text="${errorMessage}"></span>
    </div>

    <!-- Page header -->
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-4">
        <div>
            <h1 class="section-title mb-1">
                <i class="fa-solid fa-list me-2" style="color:var(--color-primary);"></i>
                My Listings
            </h1>
            <p class="text-muted mb-0" th:text="${#lists.size(listings)} + ' listing(s) total'">0 listings</p>
        </div>
        <a th:href="@{/my-listings/new}" class="btn-primary-bl">
            <i class="fa-solid fa-plus me-1"></i>New Listing
        </a>
    </div>

    <!-- Listings table (desktop) / cards (mobile) -->
    <div th:if="${not #lists.isEmpty(listings)}">

        <!-- Desktop table -->
        <div class="listings-table d-none d-md-block">
            <table class="w-100" style="border-collapse: collapse;">
                <thead>
                    <tr>
                        <th>Book</th>
                        <th>Condition</th>
                        <th>Price</th>
                        <th>Status</th>
                        <th>Campus</th>
                        <th>Listed</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="listing : ${listings}">
                        <td>
                            <div class="d-flex align-items-center gap-3">
                                <div style="width:48px; height:60px; border-radius:var(--radius-md);
                                            background:linear-gradient(135deg,#EEF2FF,#E0E7FF);
                                            display:flex; align-items:center; justify-content:center;
                                            flex-shrink:0; overflow:hidden;">
                                    <img th:if="${listing.imageUrl != null and !#strings.isEmpty(listing.imageUrl)}"
                                         th:src="${listing.imageUrl}" th:alt="${listing.title}"
                                         style="width:100%;height:100%;object-fit:cover;"
                                         onerror="this.style.display='none';"/>
                                    <span th:if="${listing.imageUrl == null or #strings.isEmpty(listing.imageUrl)}"
                                          style="font-size:1.5rem; opacity:0.35;">📖</span>
                                </div>
                                <div>
                                    <a th:href="@{/books/{id}(id=${listing.id})}"
                                       style="font-weight:700; font-size:0.875rem; color:var(--color-gray-900);"
                                       th:text="${#strings.abbreviate(listing.title, 40)}">Title</a>
                                    <div th:if="${listing.courseCode != null}"
                                         style="font-size:0.75rem; color:var(--color-primary); font-weight:600;"
                                         th:text="${listing.courseCode}"></div>
                                </div>
                            </div>
                        </td>
                        <td>
                            <span class="badge-condition" th:classappend="${listing.condition.name()}"
                                  th:text="${listing.condition.displayName}"></span>
                        </td>
                        <td style="font-weight:700; color:var(--color-primary);"
                            th:text="${'$' + listing.price}">$0</td>
                        <td>
                            <span class="status-badge"
                                  th:classappend="'status-' + ${listing.status.name()}"
                                  th:text="${listing.status.displayName}">Status</span>
                        </td>
                        <td style="font-size:0.8rem; color:var(--color-gray-500);"
                            th:text="${listing.campus}">Campus</td>
                        <td style="font-size:0.8rem; color:var(--color-gray-500);"
                            th:text="${#temporals.format(listing.createdAt, 'dd MMM yyyy')}">Date</td>
                        <td class="text-end">
                            <div class="d-flex gap-2 justify-content-end">
                                <a th:href="@{/my-listings/{id}/edit(id=${listing.id})}"
                                   class="btn-outline-bl"
                                   style="padding:4px 12px; font-size:0.75rem; border-radius:var(--radius-md);">
                                    <i class="fa-solid fa-pen"></i> Edit
                                </a>
                                <a th:href="@{/my-listings/{id}/delete(id=${listing.id})}"
                                   class="btn-outline-bl"
                                   style="padding:4px 12px; font-size:0.75rem; border-radius:var(--radius-md);
                                          color:var(--color-danger); border-color:var(--color-danger);">
                                    <i class="fa-solid fa-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Mobile cards -->
        <div class="d-md-none d-flex flex-column gap-3">
            <div th:each="listing : ${listings}" class="bl-form-card p-3">
                <div class="d-flex gap-3 mb-2">
                    <div style="width:60px; height:75px; border-radius:var(--radius-md);
                                background:linear-gradient(135deg,#EEF2FF,#E0E7FF);
                                display:flex; align-items:center; justify-content:center;
                                flex-shrink:0; overflow:hidden;">
                        <img th:if="${listing.imageUrl != null and !#strings.isEmpty(listing.imageUrl)}"
                             th:src="${listing.imageUrl}" style="width:100%;height:100%;object-fit:cover;"
                             onerror="this.style.display='none';"/>
                        <span th:if="${listing.imageUrl == null or #strings.isEmpty(listing.imageUrl)}"
                              style="font-size:2rem; opacity:0.35;">📖</span>
                    </div>
                    <div class="flex-grow-1">
                        <a th:href="@{/books/{id}(id=${listing.id})}"
                           style="font-weight:700; font-size:0.9rem; color:var(--color-gray-900);"
                           th:text="${listing.title}">Title</a>
                        <div class="d-flex gap-2 mt-1">
                            <span class="badge-condition" th:classappend="${listing.condition.name()}"
                                  th:text="${listing.condition.displayName}"></span>
                            <span class="status-badge"
                                  th:classappend="'status-' + ${listing.status.name()}"
                                  th:text="${listing.status.displayName}">Status</span>
                        </div>
                    </div>
                    <div class="text-end">
                        <div style="font-weight:800; color:var(--color-primary); font-size:1.1rem;"
                             th:text="${'$' + listing.price}">$0</div>
                    </div>
                </div>
                <div class="d-flex gap-2 mt-2">
                    <a th:href="@{/my-listings/{id}/edit(id=${listing.id})}"
                       class="btn-outline-bl flex-grow-1 justify-content-center"
                       style="padding:6px; font-size:0.8rem; border-radius:var(--radius-md);">
                        <i class="fa-solid fa-pen me-1"></i>Edit
                    </a>
                    <a th:href="@{/my-listings/{id}/delete(id=${listing.id})}"
                       class="btn-outline-bl"
                       style="padding:6px 12px; font-size:0.8rem; border-radius:var(--radius-md);
                              color:var(--color-danger); border-color:var(--color-danger);">
                        <i class="fa-solid fa-trash"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(listings)}" class="empty-state">
        <div class="empty-icon">📝</div>
        <h3>You have no listings yet</h3>
        <p>Ready to sell some textbooks? Create your first listing now!</p>
        <a th:href="@{/my-listings/new}" class="btn-primary-bl mt-3">
            <i class="fa-solid fa-plus me-1"></i>Create Your First Listing
        </a>
    </div>
</main>

<footer th:replace="~{layout/layout :: footer}"></footer>
<th:block th:replace="~{layout/layout :: scripts}"></th:block>
</body>
</html>
