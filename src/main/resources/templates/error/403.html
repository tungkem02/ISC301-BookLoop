<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head('Access Denied')}"></head>
<body>
<nav th:replace="~{layout/layout :: navbar}"></nav>
<main class="page-container page-content">
    <div class="empty-state">
        <div class="empty-icon">🔒</div>
        <h3 th:text="${errorTitle != null} ? ${errorTitle} : 'Access Denied'">Forbidden</h3>
        <p class="text-muted"
           th:text="${errorMessage != null} ? ${errorMessage} : 'You do not have permission to access this resource.'"></p>
        <a th:href="@{/}" class="btn-primary-bl mt-3">
            <i class="fa-solid fa-house me-1"></i>Go Home
        </a>
    </div>
</main>
<footer th:replace="~{layout/layout :: footer}"></footer>
<th:block th:replace="~{layout/layout :: scripts}"></th:block>
</body>
</html>
