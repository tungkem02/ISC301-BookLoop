<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head('Error')}"></head>
<body>
<nav th:replace="~{layout/layout :: navbar}"></nav>
<main class="page-container page-content">
    <div class="empty-state">
        <div class="empty-icon">😵</div>
        <h3>Something went wrong</h3>
        <p class="text-muted" th:if="${message}" th:text="${message}"></p>
        <p class="text-muted" th:unless="${message}">An unexpected error occurred. Please try again later.</p>
        <a th:href="@{/}" class="btn-primary-bl mt-3">
            <i class="fa-solid fa-house me-1"></i>Go Home
        </a>
    </div>
</main>
<footer th:replace="~{layout/layout :: footer}"></footer>
<th:block th:replace="~{layout/layout :: scripts}"></th:block>
</body>
</html>
