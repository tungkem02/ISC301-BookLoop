<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head('My Profile')}"></head>
<body>
<nav th:replace="~{layout/layout :: navbar}"></nav>

<main class="page-container page-content">

    <!-- Flash messages -->
    <div th:if="${successMessage}" class="alert-success-bl alert-auto-dismiss fade-in-up">
        <i class="fa-solid fa-circle-check"></i>
        <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="alert-error-bl alert-auto-dismiss fade-in-up">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span th:text="${errorMessage}"></span>
    </div>

    <div class="row g-4">

        <!-- LEFT: Profile Header + Stats -->
        <div class="col-lg-4">

            <!-- Profile header card -->
            <div class="profile-header-card">
                <div class="profile-avatar-lg"
                     th:text="${#strings.substring(user.fullName, 0, 1)}">?</div>
                <h2 style="font-size:1.25rem; font-weight:800; margin-bottom:0.25rem;"
                    th:text="${user.fullName}">Full Name</h2>
                <p style="opacity:0.8; font-size:0.875rem; margin:0;"
                   th:text="${user.email}">email@example.com</p>
                <div class="mt-2" th:if="${user.university != null}">
                    <i class="fa-solid fa-graduation-cap me-1"></i>
                    <span th:text="${user.university}" style="font-size:0.875rem; opacity:0.9;"></span>
                </div>
            </div>

            <!-- Account info card -->
            <div class="bl-form-card">
                <h6 style="font-weight:700; color:var(--color-gray-700); margin-bottom:1rem;">
                    <i class="fa-solid fa-circle-info me-2" style="color:var(--color-primary);"></i>
                    Account Details
                </h6>
                <div class="mb-3">
                    <div style="font-size:0.75rem; color:var(--color-gray-400); text-transform:uppercase; letter-spacing:0.06em;">Email</div>
                    <div style="font-weight:600; font-size:0.875rem;" th:text="${user.email}">email</div>
                </div>
                <div class="mb-3" th:if="${user.campus != null}">
                    <div style="font-size:0.75rem; color:var(--color-gray-400); text-transform:uppercase; letter-spacing:0.06em;">Campus</div>
                    <div style="font-weight:600; font-size:0.875rem;" th:text="${user.campus}">campus</div>
                </div>
                <div class="mb-3" th:if="${user.phone != null}">
                    <div style="font-size:0.75rem; color:var(--color-gray-400); text-transform:uppercase; letter-spacing:0.06em;">Phone</div>
                    <div style="font-weight:600; font-size:0.875rem;" th:text="${user.phone}">phone</div>
                </div>
                <div>
                    <div style="font-size:0.75rem; color:var(--color-gray-400); text-transform:uppercase; letter-spacing:0.06em;">Role</div>
                    <span class="status-badge status-AVAILABLE" th:text="${user.role.name()}">STUDENT</span>
                </div>
                <div class="mt-3">
                    <div style="font-size:0.75rem; color:var(--color-gray-400); text-transform:uppercase; letter-spacing:0.06em;">Member Since</div>
                    <div style="font-weight:600; font-size:0.875rem;"
                         th:text="${#temporals.format(user.createdAt, 'MMMM yyyy')}">Jan 2024</div>
                </div>
            </div>

            <!-- Quick links -->
            <div class="bl-form-card mt-0">
                <a th:href="@{/my-listings}" class="btn-primary-bl w-100 justify-content-center mb-2">
                    <i class="fa-solid fa-list me-2"></i>My Listings
                </a>
                <a th:href="@{/my-listings/new}" class="btn-outline-bl w-100 justify-content-center">
                    <i class="fa-solid fa-plus me-2"></i>Create New Listing
                </a>
            </div>
        </div>

        <!-- RIGHT: Edit Profile Form -->
        <div class="col-lg-8">
            <div class="bl-form-card">
                <h5 style="font-weight:700; margin-bottom:1.5rem;">
                    <i class="fa-solid fa-pen-to-square me-2" style="color:var(--color-primary);"></i>
                    Edit Profile
                </h5>

                <form th:action="@{/profile/update}" method="post"
                      th:object="${profileForm}">

                    <!-- Full Name -->
                    <div class="bl-form-group">
                        <label for="fullName">Full Name <span class="text-danger">*</span></label>
                        <input type="text" id="fullName" th:field="*{fullName}"
                               class="bl-form-control"
                               th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"/>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}">
                            <span th:errors="*{fullName}"></span>
                        </div>
                    </div>

                    <!-- University + Campus -->
                    <div class="row g-3">
                        <div class="col-sm-6">
                            <div class="bl-form-group mb-0">
                                <label for="university">University</label>
                                <input type="text" id="university" th:field="*{university}"
                                       class="bl-form-control" placeholder="Your university"/>
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <div class="bl-form-group mb-0">
                                <label for="campus">Campus</label>
                                <input type="text" id="campus" th:field="*{campus}"
                                       class="bl-form-control" placeholder="Your campus or location"/>
                            </div>
                        </div>
                    </div>

                    <!-- Phone -->
                    <div class="bl-form-group mt-3">
                        <label for="phone">Phone <span class="text-muted small">(optional)</span></label>
                        <input type="tel" id="phone" th:field="*{phone}"
                               class="bl-form-control" placeholder="+1 555 0100"/>
                    </div>

                    <!-- Avatar URL -->
                    <div class="bl-form-group">
                        <label for="avatarUrl">Avatar Image URL <span class="text-muted small">(optional)</span></label>
                        <input type="url" id="avatarUrl" th:field="*{avatarUrl}"
                               class="bl-form-control" placeholder="https://example.com/avatar.jpg"/>
                        <small class="text-muted">Enter a URL to a profile picture.</small>
                    </div>

                    <!-- Note: email and password cannot be changed here -->
                    <div class="alert-warning-bl mb-4">
                        <i class="fa-solid fa-lock"></i>
                        <small>Email address and password cannot be changed on this page for security reasons.</small>
                    </div>

                    <button type="submit" class="btn-primary-bl">
                        <i class="fa-solid fa-floppy-disk me-2"></i>Save Changes
                    </button>
                    <a th:href="@{/profile}" class="btn-outline-bl ms-2">Cancel</a>
                </form>
            </div>
        </div>

    </div><!-- /row -->
</main>

<footer th:replace="~{layout/layout :: footer}"></footer>
<th:block th:replace="~{layout/layout :: scripts}"></th:block>
</body>
</html>
