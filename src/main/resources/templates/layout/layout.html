<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--
  BookLoop — Shared layout template.
  All pages extend this layout using th:fragment and th:replace.
-->
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="BookLoop — Buy and sell used university textbooks at student-friendly prices."/>
    <title th:text="${pageTitle} + ' | BookLoop'">BookLoop</title>

    <!-- Bootstrap 5 -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
          crossorigin="anonymous"/>

    <!-- Font Awesome 6 -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          crossorigin="anonymous" referrerpolicy="no-referrer"/>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet"/>

    <!-- BookLoop custom stylesheet -->
    <link rel="stylesheet" th:href="@{/css/bookloop.css}"/>
</head>

<!--
  Navbar fragment — included in every page.
  Uses Thymeleaf Security extras (sec:authorize) to show/hide elements
  based on authentication state.
-->
<nav th:fragment="navbar" class="navbar navbar-expand-lg bl-navbar">
    <div class="container-fluid page-container">

        <!-- Brand -->
        <a class="navbar-brand" th:href="@{/}">
            <div class="brand-logo">B</div>
            <div>
                BookLoop
                <span class="brand-subtitle">Student Textbook Market</span>
            </div>
        </a>

        <!-- Mobile toggle -->
        <button class="navbar-toggler border-0" type="button"
                data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <!-- Nav links -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">
                        <i class="fa-solid fa-house me-1"></i>Home
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/books}">
                        <i class="fa-solid fa-book me-1"></i>Browse Books
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/my-listings}">
                        <i class="fa-solid fa-list me-1"></i>My Listings
                    </a>
                </li>
            </ul>

            <!-- Search bar (desktop) -->
            <form class="search-form d-none d-lg-block me-3" th:action="@{/books}" method="get">
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" name="keyword" placeholder="Search books, courses..."
                           aria-label="Search books" id="navSearchInput"/>
                    <button type="submit">Search</button>
                </div>
            </form>

            <!-- Auth actions -->
            <div class="d-flex align-items-center gap-2">

                <!-- Sell button (authenticated) -->
                <a sec:authorize="isAuthenticated()"
                   th:href="@{/my-listings/new}"
                   class="btn btn-sell text-decoration-none">
                    <i class="fa-solid fa-plus me-1"></i>Sell a Book
                </a>

                <!-- User dropdown (authenticated) -->
                <div sec:authorize="isAuthenticated()" class="dropdown">
                    <button class="avatar-btn dropdown-toggle border-0 p-0"
                            type="button" id="userDropdown"
                            data-bs-toggle="dropdown" aria-expanded="false"
                            title="Account menu">
                        <span sec:authentication="name" class="d-none d-md-block"
                              style="font-size:0.75rem; font-weight:700;"></span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0"
                        style="border-radius: 0.75rem; min-width: 180px;"
                        aria-labelledby="userDropdown">
                        <li class="px-3 py-2 border-bottom">
                            <small class="text-muted d-block">Signed in as</small>
                            <strong sec:authentication="name" style="font-size:0.8rem;"></strong>
                        </li>
                        <li>
                            <a class="dropdown-item" th:href="@{/profile}">
                                <i class="fa-solid fa-user me-2 text-muted"></i>My Profile
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" th:href="@{/my-listings}">
                                <i class="fa-solid fa-list me-2 text-muted"></i>My Listings
                            </a>
                        </li>
                        <li><hr class="dropdown-divider"/></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="m-0">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="dropdown-item text-danger">
                                    <i class="fa-solid fa-right-from-bracket me-2"></i>Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>

                <!-- Login / Register (anonymous) -->
                <div sec:authorize="!isAuthenticated()" class="d-flex gap-2">
                    <a th:href="@{/login}" class="btn-outline-bl">Log In</a>
                    <a th:href="@{/register}" class="btn-primary-bl">Register</a>
                </div>
            </div>
        </div>
    </div>
</nav>

<!-- Footer fragment -->
<footer th:fragment="footer" class="bl-footer">
    <div class="page-container">
        <div class="row align-items-center">
            <div class="col-md-6 mb-3 mb-md-0">
                <strong class="text-dark">BookLoop</strong>
                &copy; <span th:text="${#temporals.year(#temporals.createNow())}">2024</span>
                &bull; University Student Textbook Marketplace
            </div>
            <div class="col-md-6 text-md-end">
                <a th:href="@{/}" class="me-3">Home</a>
                <a th:href="@{/books}" class="me-3">Browse Books</a>
                <a sec:authorize="isAuthenticated()" th:href="@{/my-listings}">My Listings</a>
            </div>
        </div>
    </div>
</footer>

<!-- JavaScript dependencies fragment -->
<th:block th:fragment="scripts">
    <!-- Bootstrap 5 bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
            crossorigin="anonymous"></script>
    <!-- BookLoop custom JS -->
    <script th:src="@{/js/bookloop.js}"></script>
</th:block>

</html>
