# =============================================================================
# BookLoop Application Configuration
# All database credentials are read from environment variables.
# Never commit actual credentials to source control.
# =============================================================================

spring.application.name=BookLoop

# =============================================================================
# SQL Server Database Configuration
# Set these environment variables before running:
#   DB_HOST     - SQL Server hostname or IP (e.g., localhost)
#   DB_PORT     - SQL Server port (default 1433, but your instance may differ)
#   DB_NAME     - Database name (e.g., BookLoopDB)
#   DB_USER     - SQL Server login username
#   DB_PASS     - SQL Server login password
# =============================================================================
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:BookLoopDB};encrypt=true;trustServerCertificate=true;
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# =============================================================================
# JPA / Hibernate Settings
# =============================================================================
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
# update: adds missing tables/columns automatically — safe for development.
# Change to 'validate' or use Flyway/Liquibase for production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =============================================================================
# Thymeleaf
# =============================================================================
spring.thymeleaf.cache=false

# =============================================================================
# Web / MVC
# =============================================================================
server.port=8080
spring.mvc.hiddenmethod.filter.enabled=true

# =============================================================================
# Logging
# =============================================================================
logging.level.com.bookloop=DEBUG
logging.level.org.springframework.security=INFO
