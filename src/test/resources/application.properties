# =========================================================
# BookLoop — Test configuration (uses H2 in-memory database)
# =========================================================

spring.application.name=BookLoop-Test

# H2 in-memory database (no SQL Server needed for tests)
spring.datasource.url=jdbc:h2:mem:bookloop_test;DB_CLOSE_DELAY=-1;MODE=MSSQLServer
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Thymeleaf
spring.thymeleaf.cache=false

# MVC
spring.mvc.hiddenmethod.filter.enabled=true
